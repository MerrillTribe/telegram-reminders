export default {
  /**
   * Runs when Cloudflare invokes one of the configured Cron Triggers.
   */
  async scheduled(controller, env, ctx) {
    if (!isDenverSendTime()) {
      console.log(
        `Skipping scheduled run. Current Denver time: ${getDenverTimestamp()}`
      );
      return;
    }

    ctx.waitUntil(sendTelegramReminder(env));
  },

  /**
   * Allows a protected manual test through the Worker's public URL.
   *
   * Send a POST request with:
   * Authorization: Bearer YOUR_MANUAL_TRIGGER_SECRET
   */
  async fetch(request, env) {
    if (request.method !== "POST") {
      return jsonResponse(
        {
          ok: false,
          error: "Method not allowed. Use POST.",
        },
        405
      );
    }

    if (!env.MANUAL_TRIGGER_SECRET) {
      return jsonResponse(
        {
          ok: false,
          error: "MANUAL_TRIGGER_SECRET is not configured.",
        },
        500
      );
    }

    const authorization = request.headers.get("Authorization");

    if (authorization !== `Bearer ${env.MANUAL_TRIGGER_SECRET}`) {
      return jsonResponse(
        {
          ok: false,
          error: "Unauthorized.",
        },
        401
      );
    }

    try {
      const telegramResult = await sendTelegramReminder(env);

      return jsonResponse({
        ok: true,
        message: "Telegram reminder sent successfully.",
        telegram_message_id: telegramResult.result?.message_id ?? null,
      });
    } catch (error) {
      console.error("Manual Telegram send failed:", error);

      return jsonResponse(
        {
          ok: false,
          error: error instanceof Error ? error.message : String(error),
        },
        500
      );
    }
  },
};

/**
 * Sends the weekly reminder through the Telegram Bot API.
 */
async function sendTelegramReminder(env) {
  validateEnvironment(env);

  const message = [
    "<b>📅 PACT Weekly Training Net Reminder</b>",
    "",
    "The net will be held tonight at <b>2030hrs (8:30 PM)</b>.",
    "",
    "We'll begin with check-ins on:",
    "",
    "<b>439.800 MHz (Simplex)</b>",
    "",
    "After check-ins, we'll switch to the <b>'47 Repeater</b> for announcements, traffic, and the weekly training topic:",
    "",
    "RX: 145.470 MHz",
    "TX: 144.870 MHz",
    "CTCSS: 100.0 Hz",
    "",
    "We look forward to hearing you on the air.",
  ].join("\n");

  const telegramUrl =
    `https://api.telegram.org/bot${env.BOT_TOKEN}/sendMessage`;

  console.log(`Sending Telegram reminder at ${getDenverTimestamp()}.`);

  const response = await fetch(telegramUrl, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify({
      chat_id: env.CHAT_ID,
      text: message,
      parse_mode: "HTML",
    }),
  });

  const responseText = await response.text();

  let responseData;

  try {
    responseData = JSON.parse(responseText);
  } catch {
    throw new Error(
      `Telegram returned invalid JSON with HTTP ${response.status}: ${responseText}`
    );
  }

  if (!response.ok || responseData.ok !== true) {
    throw new Error(
      `Telegram request failed with HTTP ${response.status}: ${responseText}`
    );
  }

  console.log(
    `Telegram reminder sent successfully. Message ID: ${
      responseData.result?.message_id ?? "unknown"
    }`
  );

  return responseData;
}

/**
 * Cloudflare runs both UTC cron triggers.
 *
 * Only the trigger that corresponds to Wednesday at 7:00 PM
 * in America/Denver is permitted to send.
 */
function isDenverSendTime(date = new Date()) {
  const parts = getDenverDateParts(date);

  return (
    parts.weekday === "Wed" &&
    parts.hour === "19" &&
    parts.minute === "00"
  );
}

/**
 * Returns the relevant Denver-local date parts.
 */
function getDenverDateParts(date = new Date()) {
  const formatter = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Denver",
    weekday: "short",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23",
    timeZoneName: "short",
  });

  return Object.fromEntries(
    formatter
      .formatToParts(date)
      .filter((part) => part.type !== "literal")
      .map((part) => [part.type, part.value])
  );
}

/**
 * Creates a readable Denver-local timestamp for Worker logs.
 */
function getDenverTimestamp(date = new Date()) {
  return new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Denver",
    weekday: "short",
    year: "numeric",
    month: "short",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    timeZoneName: "short",
  }).format(date);
}

/**
 * Validates required Worker secrets.
 */
function validateEnvironment(env) {
  if (!env.BOT_TOKEN) {
    throw new Error("BOT_TOKEN secret is missing.");
  }

  if (!env.CHAT_ID) {
    throw new Error("CHAT_ID secret is missing.");
  }
}

/**
 * Returns a JSON HTTP response.
 */
function jsonResponse(body, status = 200) {
  return new Response(JSON.stringify(body, null, 2), {
    status,
    headers: {
      "Content-Type": "application/json; charset=utf-8",
      "Cache-Control": "no-store",
    },
  });
}
